<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABA 数据</title>
<style>
:root{
  --bg:#f5f7fa;--card:#fff;--border:#e8eaed;--primary:#3b82f6;--primary-d:#2563eb;--primary-l:#eff6ff;
  --ink:#1e293b;--muted:#64748b;--green:#22c55e;--red:#ef4444;--orange:#f59e0b;--shadow:0 1px 2px rgba(0,0,0,.03)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:13px;display:flex;flex-direction:column}

.topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap}
.topbar h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.topbar select,.topbar input,.topbar button{padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none;color:var(--ink);background:#fff}
.topbar input{flex:1;min-width:140px;max-width:240px}
.topbar select:focus,.topbar input:focus{border-color:var(--primary)}
.topbar .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);cursor:pointer;font-weight:600}
.topbar .btn-primary:hover{background:var(--primary-d)}
.topbar .btn-primary:disabled{background:#94a3b8;border-color:#94a3b8;cursor:wait}
.cache-tag{font-size:10px;color:var(--muted);padding:2px 6px;background:#f1f5f9;border-radius:3px;margin-left:auto}
.cookie-status{font-size:10px;color:var(--green);padding:2px 6px}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--border);cursor:pointer;font-size:12px}
.btn-secondary:hover{border-color:var(--primary);color:var(--primary)}

/* Cookie 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.hidden{display:none}
.modal{background:#fff;border-radius:10px;padding:20px 24px;width:90%;max-width:520px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:14px;font-weight:700;margin-bottom:8px}
.modal p{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:12px}
.modal textarea{width:100%;height:100px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:monospace;font-size:11px;resize:vertical;outline:none}
.modal textarea:focus{border-color:var(--primary)}
.modal .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.modal .modal-actions button{padding:6px 16px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border)}
.modal .modal-actions .btn-save{background:var(--primary);color:#fff;border-color:var(--primary)}
.modal .modal-actions .btn-cancel{background:#fff;color:var(--ink)}

.main{flex:1;overflow:auto;padding:12px 16px}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .icon{font-size:36px;margin-bottom:10px}
.empty .msg{font-size:13px;line-height:1.7;max-width:480px;margin:0 auto}
.empty code{background:#f1f5f9;padding:1px 5px;border-radius:3px;font-size:11px}

.err{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 14px;border-radius:6px;font-size:12px;line-height:1.6;margin:10px 0;white-space:pre-wrap;word-break:break-word}
.info{background:var(--primary-l);border:1px solid #bfdbfe;color:var(--primary-d);padding:8px 12px;border-radius:6px;font-size:11px;line-height:1.6;margin:8px 0}

table.aba{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:12px}
table.aba th{background:#f8fafc;color:var(--muted);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
table.aba th .sort{opacity:.4;margin-left:3px;font-size:10px}
table.aba th.active{color:var(--primary-d)}
table.aba th.active .sort{opacity:1}
table.aba td{padding:8px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
table.aba tr:last-child td{border-bottom:none}
table.aba tr:hover td{background:#fafbfc}
.kw{color:var(--ink);font-weight:600}
.kw .trend{display:inline-block;width:60px;height:22px;vertical-align:middle;margin-left:6px;background:#f1f5f9;border-radius:3px;position:relative;overflow:hidden}
.kw .trend canvas{width:60px;height:22px;display:block}
.kw .asin-link{font-size:10px;color:var(--primary);margin-left:5px;text-decoration:none}
.kw .sub{font-size:10px;color:var(--muted);margin-top:2px;display:block;line-height:1.4}
.r-up{color:var(--green)}
.r-down{color:var(--red)}
.r-flat{color:var(--muted)}
.cat-stats{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
.brand-img{width:30px;height:30px;border-radius:3px;object-fit:contain;background:#f1f5f9;display:inline-block;vertical-align:middle;margin-right:3px}
.asin-img{width:40px;height:40px;border-radius:3px;object-fit:contain;background:#f1f5f9;display:block;margin-bottom:2px}

.load-more{text-align:center;padding:20px;color:var(--muted);font-size:12px}
.load-more button{padding:6px 18px;border:1px solid var(--border);background:#fff;border-radius:6px;cursor:pointer;font-size:12px}
.load-more button:hover{border-color:var(--primary);color:var(--primary)}
.load-more button:disabled{opacity:.5;cursor:wait}

.status{font-size:10px;color:var(--muted);padding:4px 16px;background:var(--card);border-top:1px solid var(--border)}
</style>
</head>
<body>

<div class="topbar">
  <h1>📊 ABA 数据</h1>
  <select id="marketSel">
    <option value="COM">🇺🇸 美国站</option>
    <option value="JP">🇯🇵 日本站</option>
    <option value="DE">🇩🇪 德国站</option>
    <option value="UK">🇬🇧 英国站</option>
    <option value="FR">🇫🇷 法国站</option>
    <option value="IT">🇮🇹 意大利站</option>
    <option value="ES">🇪🇸 西班牙站</option>
  </select>
  <input type="text" id="qInput" placeholder="搜索关键词（留空 = 全部）">
  <button id="searchBtn" class="btn-primary">查询</button>
  <button id="cookieBtn" class="btn-secondary" title="设置 SellerSprite cookie">🔑 Cookie</button>
  <span id="cacheTag" class="cache-tag" style="display:none">缓存</span>
  <span id="cookieStatus" class="cookie-status" style="display:none"></span>
</div>

<div class="main" id="mainArea">
  <div class="empty" id="emptyHint">
    <div class="icon">🔍</div>
    <div class="msg">输入关键词或选择站点开始查询 ABA 数据<br><br>数据来源：SellerSprite<br>查询结果会缓存 5 分钟</div>
  </div>
</div>

<div class="status" id="statusBar">就绪</div>

<!-- Cookie 设置弹窗 -->
<div class="modal-overlay hidden" id="cookieModal">
  <div class="modal">
    <h3>🔑 SellerSprite Cookie</h3>
    <p>登录 SellerSprite 后，打开浏览器 DevTools（F12）→ Network → 任意请求 → 复制 Cookie 请求头粘贴到此处。<br>Cookie 仅保存在本地浏览器，不会上传服务器（仅转发给 SellerSprite API）。</p>
    <textarea id="cookieInput" placeholder="ecookie=xxx; _ga=xxx; JSESSIONID=xxx; ..."></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" id="cookieCancelBtn">取消</button>
      <button class="btn-save" id="cookieSaveBtn">保存</button>
    </div>
  </div>
</div>

<script>
const MARKET_NAME={COM:'美国',JP:'日本',DE:'德国',UK:'英国',FR:'法国',IT:'意大利',ES:'西班牙'};

let currentPage=1,currentSize=50,currentOrderField='searchRank',currentOrderDesc=true,isLoading=false,endReached=false;

const $=id=>document.getElementById(id);
const SS_COOKIE_KEY='ss_cookie';

function getCookie(){return localStorage.getItem(SS_COOKIE_KEY)||'';}
function setCookieStatus(){
  const s=$('cookieStatus');
  const c=getCookie();
  if(c){s.textContent='🔑 已设置';s.style.display='';s.style.color='var(--green)';}
  else{s.textContent='⚠️ 未设置';s.style.display='';s.style.color='var(--orange)';}
}

function openCookieModal(){$('cookieInput').value=getCookie();$('cookieModal').classList.remove('hidden');}
function closeCookieModal(){$('cookieModal').classList.add('hidden');}
function saveCookie(){
  const v=$('cookieInput').value.trim();
  if(v)localStorage.setItem(SS_COOKIE_KEY,v);
  else localStorage.removeItem(SS_COOKIE_KEY);
  setCookieStatus();
  closeCookieModal();
}

function setStatus(msg){$('statusBar').textContent=msg;}

function showEmpty(){
  $('mainArea').innerHTML=`
    <div class="empty">
      <div class="icon">🔍</div>
      <div class="msg">输入关键词或选择站点开始查询 ABA 数据<br><br>数据来源：SellerSprite<br>查询结果会缓存 5 分钟</div>
    </div>`;
}

function showError(msg){
  $('mainArea').innerHTML=`<div class="err">❌ ${msg}</div>`;
}

function showInfo(msg){
  $('mainArea').innerHTML=`<div class="info">ℹ ${msg}</div>`;
}

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function fmtNum(n){
  if(n==null||n==='')return '-';
  if(typeof n==='string')return n;
  if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2)+'M';
  if(Math.abs(n)>=1e3)return (n/1e3).toFixed(2)+'K';
  return Number.isInteger(n)?String(n):n.toFixed(2);
}

function renderTrend(canvas, searchesArr, rankArr){
  if(!searchesArr||!Array.isArray(searchesArr)||searchesArr.length<2)return;
  const ctx=canvas.getContext('2d');
  const w=canvas.width=80,h=canvas.height=24;
  const sMin=Math.min(...searchesArr),sMax=Math.max(...searchesArr);
  const sRange=sMax-sMin||1;
  // 搜索量折线（蓝色）
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.2;ctx.beginPath();
  searchesArr.forEach((v,i)=>{
    const x=i/(searchesArr.length-1)*w;
    const y=h-(v-sMin)/sRange*h;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  // 排名趋势线（橙色虚线，取反：排名越低越好）
  if(rankArr&&Array.isArray(rankArr)&&rankArr.length===searchesArr.length){
    const rMin=Math.min(...rankArr),rMax=Math.max(...rankArr);
    const rRange=rMax-rMin||1;
    ctx.strokeStyle='#f59e0b';ctx.lineWidth=0.8;ctx.setLineDash([3,2]);ctx.beginPath();
    rankArr.forEach((v,i)=>{
      const x=i/(rankArr.length-1)*w;
      const y=h-(v-rMin)/rRange*h;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();ctx.setLineDash([]);
  }
}

function changeClass(v){if(v==null)return 'r-flat';if(v>0)return 'r-up';if(v<0)return 'r-down';return 'r-flat';}
function changeIcon(v){if(v==null)return '';if(v>0)return '↑';if(v<0)return '↓';return '−';}

function renderRow(item){
  // === 真实字段映射 ===
  const kw=item.keyword||'';
  const kwCn=item.keywordCn||'';
  const searches=item.searches||0;
  const clicks=item.clicks||0;
  const impressions=item.impressions||0;
  const purchaseRate=item.purchaseRate;
  const purchases=item.purchases||0;
  const products=item.products||0;
  const departments=item.departments||[];
  const searchRank=item.searchRank;
  const searchRankGrowthRate=item.searchRankGrowthRate;
  const searchRankGrowthValue=item.searchRankGrowthValue;
  const clickShareRate=item.clickShareRate;
  const cvsShareRate=item.cvsShareRate;
  const titleDensity=item.titleDensityExact;
  const cprExact=item.cprExact;
  const phrasePpc=item.phrasePpc;
  const broadPpc=item.broadPpc;
  const exactPpc=item.exactPpc;
  const top3Brands=item.top3Brands||[];
  const top3Asins=item.top3AsinDtoList||[];
  const trends=item.trends||[];
  const gkDatas=item.gkDatas||[];

  // 周排名变化
  const w1Rank=item.w1SearchRank;
  const w4Rank=item.w4SearchRank;
  const w12Rank=item.w12SearchRank;
  const w1GrowthRate=item.w1RankGrowthRate;
  const w4GrowthRate=item.w4RankGrowthRate;
  const w12GrowthRate=item.w12RankGrowthRate;

  // 趋势数据
  const trendSearches=trends.map(t=>t.searches);
  const trendRanks=trends.map(t=>t.rank);

  // ASIN 图片（取前3个）
  const topAsinImgs=gkDatas.slice(0,3);
  // 也支持 top3AsinDtoList 里的图片
  const asinDtoImgs=top3Asins.slice(0,3);

  return `<tr>
    <td>
      <div class="kw">
        ${escapeHtml(kw)}
        ${kwCn?`<span class="sub">${escapeHtml(kwCn)}</span>`:''}
        ${trends.length>=2?'<canvas class="trend" width="80" height="24"></canvas>':''}
      </div>
      ${departments.length?`<div class="cat-stats">所属类目：${departments.map(d=>escapeHtml(d)).join(' > ')}</div>`:''}
    </td>
    <td>
      ${searchRank!=null?fmtNum(searchRank):'-'}
      ${searchRankGrowthRate!=null?`<div class="${changeClass(searchRankGrowthRate)}" style="font-size:10px">${changeIcon(searchRankGrowthRate)}${(searchRankGrowthRate*100).toFixed(1)}%</div>`:''}
    </td>
    <td>${fmtNum(searches)}</td>
    <td>
      <div style="font-size:10px;line-height:1.6">
        ${w1Rank!=null?`<div>1周前 <b>${fmtNum(w1Rank)}</b> <span class="${changeClass(w1GrowthRate)}">${changeIcon(w1GrowthRate)}${w1GrowthRate!=null?(w1GrowthRate*100).toFixed(1)+'%':''}</span></div>`:''}
        ${w4Rank!=null?`<div>4周前 <b>${fmtNum(w4Rank)}</b> <span class="${changeClass(w4GrowthRate)}">${changeIcon(w4GrowthRate)}${w4GrowthRate!=null?(w4GrowthRate*100).toFixed(1)+'%':''}</span></div>`:''}
        ${w12Rank!=null?`<div>12周前 <b>${fmtNum(w12Rank)}</b> <span class="${changeClass(w12GrowthRate)}">${changeIcon(w12GrowthRate)}${w12Rank!=null?(w12GrowthRate*100).toFixed(1)+'%':''}</span></div>`:''}
      </div>
    </td>
    <td>${clickShareRate!=null?(clickShareRate*100).toFixed(2)+'%':'-'}</td>
    <td>${cvsShareRate!=null?(cvsShareRate*100).toFixed(2)+'%':'-'}</td>
    <td>
      <div style="font-size:10px;line-height:1.6">
        ${phrasePpc!=null?`<div>Phrase <b>$${phrasePpc.toFixed(2)}</b></div>`:''}
        ${broadPpc!=null?`<div>Broad <b>$${broadPpc.toFixed(2)}</b></div>`:''}
        ${exactPpc!=null?`<div>Exact <b>$${exactPpc.toFixed(2)}</b></div>`:''}
      </div>
    </td>
    <td>
      ${titleDensity!=null?fmtNum(titleDensity):'-'}
      ${cprExact!=null?`<div class="cat-stats">CPR ${cprExact}</div>`:''}
    </td>
    <td>
      <div style="display:flex;gap:4px;flex-wrap:wrap">
        ${topAsinImgs.map(a=>`<a href="https://www.amazon.com/dp/${escapeHtml(a.asin)}" target="_blank" rel="noopener" title="${escapeHtml(a.asinTitle||'')}"><img class="asin-img" src="${escapeHtml(a.asinImage)}" onerror="this.style.display='none'" alt="${escapeHtml(a.asin)}"><span style="font-size:9px;color:var(--muted)">${escapeHtml(a.asin)}</span></a>`).join('')}
        ${asinDtoImgs.filter(a=>a.imageUrl&&!topAsinImgs.find(t=>t.asin===a.asin)).map(a=>`<a href="https://www.amazon.com/dp/${escapeHtml(a.asin)}" target="_blank" rel="noopener"><img class="asin-img" src="${escapeHtml(a.imageUrl)}" onerror="this.style.display='none'" alt="${escapeHtml(a.asin)}"><span style="font-size:9px;color:var(--muted)">${escapeHtml(a.asin)}</span>${a.clickRate!=null?`<div style="font-size:9px">点击 ${(a.clickRate*100).toFixed(1)}%</div>`:''}${a.conversionRate!=null?`<div style="font-size:9px">转化 ${(a.conversionRate*100).toFixed(1)}%</div>`:''}</a>`).join('')}
      </div>
    </td>
    <td>
      <div style="font-size:11px;line-height:1.8">
        ${top3Brands.map(b=>`<div>🏷️ ${escapeHtml(b)}</div>`).join('')}
      </div>
    </td>
  </tr>`;
}

function renderTable(items,append){
  let html=`<table class="aba">
    <thead><tr>
      <th>关键词</th>
      <th data-field="searchRank" class="active">搜索排名 <span class="sort">${currentOrderField==='searchRank'?(currentOrderDesc?'▼':'▲'):'⇅'}</span></th>
      <th>搜索量</th>
      <th>历史排名（1/4/12周）</th>
      <th>点击份额</th>
      <th>转化份额</th>
      <th>PPC（Phrase/Broad/Exact）</th>
      <th>标题密度</th>
      <th>Top3 ASIN</th>
      <th>Top3 品牌</th>
    </tr></thead>
    <tbody>
    ${items.map(renderRow).join('')}
    </tbody>
  </table>`;
  if(append){
    const existing=document.querySelector('table.aba tbody');
    if(existing){
      existing.insertAdjacentHTML('beforeend',items.map(renderRow).join(''));
      // 渲染新增行的趋势图
      const newRows=existing.querySelectorAll('tr');
      const offset=newRows.length-items.length;
      items.forEach((item,i)=>{
        const row=newRows[offset+i];
        if(!row)return;
        const c=row.querySelector('canvas.trend');
        if(c){
          const trends=item.trends||[];
          renderTrend(c,trends.map(t=>t.searches),trends.map(t=>t.rank));
        }
      });
      return;
    }
  }
  html=`<div style="overflow:auto;max-height:calc(100vh - 130px);border-radius:8px;">${html}</div>`;
  $('mainArea').innerHTML=html;
  // 渲染所有趋势图
  $('mainArea').querySelectorAll('canvas.trend').forEach((c,i)=>{
    const item=items[i];
    if(!item)return;
    const trends=item.trends||[];
    renderTrend(c,trends.map(t=>t.searches),trends.map(t=>t.rank));
  });
  $('mainArea').querySelectorAll('th[data-field]').forEach(th=>{
    th.onclick=()=>{
      const f=th.dataset.field;
      if(currentOrderField===f){currentOrderDesc=!currentOrderDesc;}else{currentOrderField=f;currentOrderDesc=false;}
      doSearch(true);
    };
  });
  // 加载更多
  const more=document.createElement('div');
  more.className='load-more';
  more.innerHTML=`<button id="loadMoreBtn">${endReached?'已加载全部':'加载更多'}</button>`;
  $('mainArea').appendChild(more);
  const moreBtn=$('loadMoreBtn');
  if(moreBtn&&!endReached){
    moreBtn.onclick=()=>{currentPage++;doSearch(false,true);};
  }
}

async function doSearch(reset,append){
  if(isLoading)return;
  isLoading=true;
  const btn=$('searchBtn');
  if(reset){btn.disabled=true;btn.textContent='查询中...';currentPage=1;endReached=false;}
  const market=$('marketSel').value;
  const q=$('qInput').value.trim();
  setStatus(`查询 ${MARKET_NAME[market]} 站，关键词：${q||'全部'}，第 ${currentPage} 页...`);

  try{
    const cookie=getCookie();
    if(!cookie){
      if(reset)showError('请先点击「🔑 Cookie」按钮设置 SellerSprite cookie');
      else setStatus('请先设置 cookie');
      return;
    }
    const res=await fetch('/api/aba-research',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        market,q,
        page:currentPage,
        size:currentSize,
        order:{field:currentOrderField,desc:currentOrderDesc},
        cookie
      })
    });
    const data=await res.json();
    if(!res.ok){
      if(reset)showError((data&&data.error)||('HTTP '+res.status));
      else setStatus('加载失败: '+(data&&data.error||res.status));
      return;
    }
    // 兼容多种返回结构
    const items=data.data?.items||data.items||data.data?.list||data.list||data.data||(Array.isArray(data)?data:[]);
    if(!Array.isArray(items)||items.length===0){
      if(reset){showInfo(`未查询到数据${data._cache==='hit'?'（来自缓存）':''}`);}
      else{endReached=true;const b=$('loadMoreBtn');if(b)b.textContent='已加载全部';}
      setStatus('共 0 条');
      return;
    }
    if(items.length<currentSize)endReached=true;
    if(reset)renderTable(items,false);
    else renderTable(items,true);
    $('cacheTag').textContent=data._cache==='hit'?'5分钟缓存':'实时';
    $('cacheTag').style.display='';
    setStatus(`已加载 ${items.length} 条 ${data._cache==='hit'?'（缓存）':''} · 排序：${currentOrderField}${currentOrderDesc?'↓':'↑'}`);
  }catch(e){
    if(reset)showError('网络错误: '+e.message);
    else setStatus('加载失败: '+e.message);
  }finally{
    isLoading=false;
    if(reset){btn.disabled=false;btn.textContent='查询';}
  }
}

$('searchBtn').onclick=()=>doSearch(true);
$('qInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch(true);});
$('marketSel').onchange=()=>{if($('qInput').value.trim())doSearch(true);};
