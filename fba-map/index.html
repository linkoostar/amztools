<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBA仓库地图</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--border:#e8eaed;--primary:#3b82f6;--primary-d:#2563eb;--primary-l:#eff6ff;--ink:#1e293b;--muted:#64748b;--green:#22c55e;--shadow:0 1px 2px rgba(0,0,0,.03)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;overflow:hidden;display:flex;flex-direction:column}

/* 顶部栏 */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;white-space:nowrap}
.topbar select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;color:var(--ink);cursor:pointer}
.topbar select:focus{border-color:var(--primary)}
.search-wrap{position:relative;flex:1;max-width:280px}
.search-wrap input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.08)}
.search-wrap .icon{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted)}
.count-badge{font-size:12px;color:var(--muted);white-space:nowrap}

/* 主体 */
.main{flex:1;display:flex;overflow:hidden}

/* 左侧列表 */
.wh-list{width:340px;min-width:340px;border-right:1px solid var(--border);overflow-y:auto;background:var(--card)}
.wh-list::-webkit-scrollbar{width:5px}
.wh-list::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
.wh-group-head{padding:8px 16px;font-size:11px;font-weight:700;color:var(--muted);background:#f8fafc;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;cursor:pointer;position:sticky;top:0;z-index:1}
.wh-group-head .toggle{margin-left:auto;font-size:10px}
.wh-item{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;border-bottom:1px solid #f1f5f9;transition:.12s}
.wh-item:hover{background:var(--primary-l)}
.wh-item.active{background:var(--primary-l);border-left:3px solid var(--primary);padding-left:13px}
.wh-item .code{font-weight:700;font-size:13px;color:var(--ink);width:60px;flex-shrink:0}
.wh-item .city{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 右侧详情 */
.wh-detail{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.wh-info{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.wh-info .code-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.wh-info .code-big{font-size:24px;font-weight:800;color:var(--primary-d)}
.wh-info .state-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;background:var(--primary-l);color:var(--primary-d)}
.wh-info .city-name{font-size:13px;color:var(--muted)}
.wh-info .addr-box{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px}
.wh-info .addr-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.wh-info .addr-text{font-size:13px;color:var(--ink);line-height:1.6}
.wh-info .copy-btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
.wh-info .copy-btn:hover{background:var(--primary-d)}
.wh-info .copy-btn.copied{background:var(--green)}
.wh-info .coord{font-size:11px;color:var(--muted);margin-top:8px}
.wh-info .btn-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.wh-info .btn-row a{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;text-decoration:none;transition:.12s}
.wh-info .btn-row a.osm{background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe}
.wh-info .btn-row a.osm:hover{background:#dbeafe}
.wh-info .btn-row a.gmaps{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.wh-info .btn-row a.gmaps:hover{background:#fde68a}
.wh-info .btn-row a.baidu{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.wh-info .btn-row a.baidu:hover{background:#dcfce7}
.svg-map{flex:1;border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px;overflow:hidden}
.svg-map svg{max-width:100%;max-height:100%;height:auto;width:auto;flex:1}
.svg-map .map-label{font-size:12px;color:var(--muted);margin-bottom:10px;text-align:center}
.svg-map .map-fallback{font-size:13px;color:var(--muted);text-align:center;padding:20px}
.wh-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px}
.wh-empty .icon{font-size:40px}
.wh-empty p{font-size:13px}
</style>
</head>
<body>
<div class="topbar">
  <h1>🗺️ FBA仓库地图</h1>
  <select id="siteSel">
    <option value="US" selected>🇺🇸 美国 (US)</option>

  </div>
  <span class="count-badge" id="countBadge">0 个仓库</span>
</div>
<div class="main">

</div>

/* 解析数据 */
function parseData(raw){
  return raw.trim().split('\n').map(l=>{
    const[c,a,s,city,lat,lng]=l.split('|');
    return{c,a,s,city,lat:+lat,lng:+lng};
  });
}

const SITES={US:'🇺🇸 美国',CA:'🇨🇦 加拿大',JP:'🇯🇵 日本',UK:'🇬🇧 英国',DE:'🇩🇪 德国'};
let currentSite='US';
let currentList=[];
let selectedWh=null;

function renderList(filter){
  const list=document.getElementById('whList');
  filter=(filter||'').toLowerCase().trim();
  let filtered=currentList;
  if(filter){
    filtered=currentList.filter(w=>w.c.toLowerCase().includes(filter)||w.city.toLowerCase().includes(filter)||w.s.toLowerCase().includes(filter));
  }
  document.getElementById('countBadge').textContent=filtered.length+' 个仓库';
  // 按州/省分组
  const groups={};
  filtered.forEach(w=>{if(!groups[w.s])groups[w.s]=[];groups[w.s].push(w);});
  // 渲染
  let html='';
  for(const[state,items]of Object.entries(groups)){
    html+='<div class="wh-group-head">'+state+' ('+items.length+')</div>';
    for(const w of items){
      html+='<div class="wh-item'+(selectedWh&&selectedWh.c===w.c?' active':'')+'" data-code="'+w.c+'"><span class="code">'+w.c+'</span><span class="city">'+w.city+'</span></div>';
    }
  }
  if(!filtered.length)html='<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">未找到匹配的仓库</div>';
  list.innerHTML=html;
  list.querySelectorAll('.wh-item').forEach(el=>{
    el.onclick=()=>selectWh(el.dataset.code);
  });
}

/* ===== 真实SVG地图 ===== */
// 州/省 → SVG path ID 映射
const JP_TO_SVG={'Chiba':'JP12','Saitama':'JP11','Tokyo':'JP13','Kanagawa':'JP14','Osaka':'JP27','Gifu':'JP21','Saga':'JP41'};
const DE_TO_SVG={'Saxony':'DESN','NRW':'DENW','Hesse':'DEHE','Lower Saxony':'DENI','Bavaria':'DEBY','Brandenburg':'DEBB','Berlin':'DEBE','RP':'DERP','BW':'DEBW'};
const GB_TO_SVG={'England':'GBENG','Wales':'GBWLS','Scotland':'GBSCT','Northern Ireland':'GBNIR'};

function getSvgId(site,state){
  if(site==='US')return 'US'+state;
  if(site==='CA')return 'CA'+state;
  if(site==='JP')return JP_TO_SVG[state]||null;
  if(site==='DE')return DE_TO_SVG[state]||null;
  if(site==='UK')return GB_TO_SVG[state]||null;
  return null;
}

// 英国简化SVG（4个国家，自定义路径）
const UK_SVG=`<svg viewBox="0 0 250 400" xmlns="http://www.w3.org/2000/svg">
<path id="GBSCT" d="M85 25 L165 25 L185 70 L175 120 L155 145 L110 145 L82 110 L70 65 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1"/>
<path id="GBNIR" d="M15 90 L50 90 L54 120 L42 140 L22 135 L10 115 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1"/>
<path id="GBWLS" d="M65 160 L100 160 L105 215 L80 240 L55 210 L55 180 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1"/>
<path id="GBENG" d="M110 145 L155 145 L175 170 L195 210 L210 265 L205 320 L185 365 L145 375 L115 360 L100 315 L108 250 L100 200 L108 165 Z" fill="#e2e8f0" stroke="#fff" stroke-width="1"/>
</svg>`;

function loadSvgMap(site,highlightState){
  const c=document.getElementById('mapContainer');
  if(!c)return;
  if(site==='UK'){
    c.innerHTML=UK_SVG;
    highlightSvg(site,highlightState);
    return;
  }
  const xhr=new XMLHttpRequest();
  xhr.open('GET','svg/'+site.toLowerCase()+'.svg',true);
  xhr.onload=function(){
    if(xhr.status===200||xhr.status===0){
      c.innerHTML=xhr.responseText.replace(/<\?xml[^>]*\?>/,'');
      highlightSvg(site,highlightState);
    }else{
      c.innerHTML='<div class="map-fallback">SVG地图加载失败（HTTP '+xhr.status+'）</div>';
    }
  };
  xhr.onerror=function(){
    c.innerHTML='<div class="map-fallback">SVG地图加载失败<br>请通过本地服务器或部署后访问</div>';
  };
  xhr.send();
}

function highlightSvg(site,highlightState){
  const svg=document.querySelector('#mapContainer svg');
  if(!svg)return;
  svg.querySelectorAll('path').forEach(p=>{
    p.setAttribute('fill','#e2e8f0');
    p.setAttribute('stroke','#ffffff');
    p.setAttribute('stroke-width','0.5');
  });
  // 有仓库的州标浅蓝色
  const whIds={};
  currentList.forEach(w=>{
    const id=getSvgId(site,w.s);
    if(id)whIds[id]=true;
  });
  Object.keys(whIds).forEach(id=>{
    const el=svg.getElementById(id);
    if(el)el.setAttribute('fill','#bfdbfe');
  });
  // 选中州标绿色
  const hlId=getSvgId(site,highlightState);
  if(hlId){
    const el=svg.getElementById(hlId);
    if(el){
      el.setAttribute('fill','#22c55e');
      el.setAttribute('stroke','#16a34a');
      el.setAttribute('stroke-width','1.5');
    }
  }
  svg.style.width='100%';
  svg.style.height='100%';
  svg.style.maxHeight='none';
}

function selectWh(code){
  const w=currentList.find(x=>x.c===code);
  if(!w)return;
  selectedWh=w;
  renderList(document.getElementById('searchInput').value);
  const lat=w.lat,lng=w.lng;
  const osmUrl='https://www.openstreetmap.org/?mlat='+lat+'&mlon='+lng+'#map=8/'+lat+'/'+lng;
  const gmapsUrl='https://www.google.com/maps?q='+lat+','+lng+'&z=9';
  const baiduUrl='https://api.map.baidu.com/marker?location='+lat+','+lng+'&title='+w.c+'&content='+encodeURIComponent(w.a)+'&output=html&src=webapp.fbaMap';
  document.getElementById('whDetail').innerHTML=`
    <div class="wh-info">
      <div class="code-row">
        <span class="code-big">${w.c}</span>
        <span class="state-tag">${w.s}</span>
        <span class="city-name">${w.city}</span>
      </div>
      <div class="addr-box">
        <div class="addr-label">仓库地址</div>
        <div class="addr-text" id="addrText">${w.a}</div>
      </div>
      <button class="copy-btn" id="copyBtn" onclick="copyAddr()">📋 复制地址</button>
      <div class="btn-row">
        <a href="${osmUrl}" target="_blank" class="osm">🗺️ OSM</a>
        <a href="${gmapsUrl}" target="_blank" class="gmaps">🌍 Google</a>
        <a href="${baiduUrl}" target="_blank" class="baidu">📐 百度</a>
      </div>
      <div class="coord">坐标: ${lat.toFixed(4)}, ${lng.toFixed(4)} | ${SITES[currentSite]}</div>
    </div>
    <div class="svg-map">
      <div class="map-label">${SITES[currentSite]} · 仓库分布（绿色为选中州/省）</div>
      <div id="mapContainer"></div>
    </div>
  `;
  loadSvgMap(currentSite,w.s);
}

function copyAddr(){
  const text=document.getElementById('addrText').textContent;
  const btn=document.getElementById('copyBtn');
  function ok(){
    btn.textContent='✓ 已复制';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='📋 复制地址';btn.classList.remove('copied');},2000);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(ok).catch(fallback);
  }else{fallback();}
  function fallback(){
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');ok();}catch(e){}
    document.body.removeChild(ta);
  }
}

function switchSite(site){
  currentSite=site;
  currentList=parseData(RAW[site]);
  selectedWh=null;
  renderList('');
  document.getElementById('whDetail').innerHTML='<div class="wh-empty"><div class="icon">🗺️</div><p>选择左侧仓库查看详情和地图位置</p></div>';
}

document.getElementById('siteSel').onchange=e=>switchSite(e.target.value);
document.getElementById('searchInput').oninput=e=>renderList(e.target.value);

// 初始化
switchSite('US');
</script>
